[package]
name = "navmesh-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"
description = "cargo-fuzz targets for navmesh-rs"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rayon = { version = "1.11", optional = true }
navmesh-rs = { path = ".." }
navmesh-parity = { path = "../parity" }

[[bin]]
name = "tile_add_query"
path = "fuzz_targets/tile_add_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recast_input"
path = "fuzz_targets/recast_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "seeds"
path = "src/bin/seeds.rs"
test = false
doc = false
bench = false

# Not part of the main workspace (nightly-only, libFuzzer).
[workspace]

[[bin]]
name = "crowd_update"
path = "fuzz_targets/crowd_update.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tilecache_update"
path = "fuzz_targets/tilecache_update.rs"
test = false
doc = false
bench = false

[features]
parallel = ["navmesh-rs/parallel", "dep:rayon"]

[[bin]]
name = "parallel_bake"
path = "fuzz_targets/parallel_bake.rs"
test = false
doc = false
bench = false
required-features = ["parallel"]

[[bin]]
name = "budgeted_query"
path = "fuzz_targets/budgeted_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "f32_import"
path = "fuzz_targets/f32_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "heuristic_path"
path = "fuzz_targets/heuristic_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "strict_triangulation"
path = "fuzz_targets/strict_triangulation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compact_dense"
path = "fuzz_targets/compact_dense.rs"
test = false
doc = false
bench = false
